server {
    if ($host = www.e-marqet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = e-marqet.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name e-marqet.com www.e-marqet.com;

    client_max_body_size 50m;
    access_log /var/log/nginx/emarqet.access.log;
    error_log /var/log/nginx/emarqet.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name e-marqet.com www.e-marqet.com;

    client_max_body_size 50m;
    access_log /var/log/nginx/emarqet.ssl.access.log;
    error_log /var/log/nginx/emarqet.ssl.error.log;

    ssl_certificate /etc/letsencrypt/live/e-marqet.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/e-marqet.com/privkey.pem; # managed by Certbot
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
