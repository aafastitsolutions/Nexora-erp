const key = 'trevoro_fb_outreach_done_v1';
let done = JSON.parse(localStorage.getItem(key) || '{}');
let mode = 'todo';
const list = document.getElementById('list');
const search = document.getElementById('search');
function save(){localStorage.setItem(key, JSON.stringify(done));}
function updateStats(){document.getElementById('doneCount').textContent = Object.values(done).filter(Boolean).length;}
function copyMessage(){const text=document.getElementById('message').value;if(navigator.clipboard){navigator.clipboard.writeText(text).catch(()=>{});}document.getElementById('message').select();}
function addText(el, text){el.appendChild(document.createTextNode(text || ''));}
function render(){
  const q = search.value.trim().toLowerCase();
  list.innerHTML = '';
  leads.filter(l => {
    const hay = [l.name,l.city,l.county,l.country,l.property_type].join(' ').toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (mode === 'todo' && done[l.id]) return false;
    return true;
  }).forEach(l => {
    const row = document.createElement('div'); row.className = 'row' + (done[l.id] ? ' done' : '');
    const label = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!done[l.id];
    cb.addEventListener('change', () => { done[l.id] = cb.checked; save(); updateStats(); render(); });
    label.appendChild(cb);
    const info = document.createElement('div');
    const name = document.createElement('div'); name.className = 'name'; addText(name, l.name);
    const meta = document.createElement('div'); meta.className = 'meta'; addText(meta, [l.property_type, l.city, l.country, l.email].filter(Boolean).join(' · '));
    info.appendChild(name); info.appendChild(meta);
    const actions = document.createElement('div'); actions.className = 'actions';
    const open = document.createElement('a'); open.className = 'primary'; open.href = l.facebook_url; open.target = '_blank'; open.rel = 'noreferrer'; addText(open, 'Open Facebook');
    const copy = document.createElement('button'); copy.type = 'button'; addText(copy, 'Copiază mesaj'); copy.addEventListener('click', copyMessage);
    actions.appendChild(open); actions.appendChild(copy);
    row.appendChild(label); row.appendChild(info); row.appendChild(actions); list.appendChild(row);
  });
  updateStats();
}
document.getElementById('copyMsg').addEventListener('click', copyMessage);
document.getElementById('showAll').addEventListener('click',()=>{mode='all';render();});
document.getElementById('showTodo').addEventListener('click',()=>{mode='todo';render();});
search.addEventListener('input', render);
render();
</script>
